# E2E self-test: runs on an ezgha-managed ephemeral runner.
# Dispatch-only on purpose — never triggered by fork PRs (self-hosted safety).
name: ezgha-selftest
run-name: ezgha-selftest ${{ inputs.nonce || github.run_id }}
on:
  workflow_dispatch:
    inputs:
      nonce:
        description: "Unique dispatch nonce for ezgha canary correlation"
        required: false
        type: string
      runs_on_json:
        description: "JSON array of runner labels for this host's canary"
        required: false
        default: '["self-hosted","ezgha"]'
        type: string

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ${{ fromJSON(inputs.runs_on_json) }}
    timeout-minutes: 10
    steps:
      - name: Prove execution environment
        env:
          CANARY_NONCE: ${{ inputs.nonce || github.run_id }}
        run: |
          set -euo pipefail
          echo "canary nonce: $CANARY_NONCE"
          echo "runner name: $RUNNER_NAME"
          echo "hostname: $(hostname)"
          uname -a
          nproc
          cat /sys/fs/cgroup/memory.max 2>/dev/null || cat /sys/fs/cgroup/memory/memory.limit_in_bytes 2>/dev/null || echo "no cgroup file"
          cat /sys/fs/cgroup/pids.max 2>/dev/null || true
          marker="$GITHUB_WORKSPACE/.ezgha-selftest-marker-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$CANARY_NONCE" > "$marker"
          readback=$(cat "$marker")
          test "$readback" = "$CANARY_NONCE"
          if command -v sha256sum >/dev/null 2>&1; then
            marker_sha=$(sha256sum "$marker" | awk '{print $1}')
          else
            marker_sha=$(shasum -a 256 "$marker" | awk '{print $1}')
          fi
          printf 'scratch workspace marker: path=%s bytes=%s sha256=%s\n' \
            "$marker" "$(wc -c < "$marker" | tr -d ' ')" "$marker_sha"
          printf 'scratch witness hold: 15 seconds\n'
          sleep 15
          echo "ephemeral runner proof: this job ran, the runner will now deregister"
