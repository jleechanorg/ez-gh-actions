name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Build
        run: cargo build --all-targets
      - name: Test
        run: cargo test
      - name: Layer-2 failure-ladder real-binary regression test
        run: bash tests/ezgha_start_failure_ladder_layer2_test.sh
      - name: Stop/serve state-lock real-binary regression test
        run: bash tests/ezgha_stop_serve_lock_test.sh
      - name: Layer-2 serve-loop failure-ladder regression test
        env:
          EZGHA_SERVE_LAYER2_ARTIFACT_DIR: ${{ runner.temp }}/ezgha-serve-layer2
        run: bash tests/ezgha_serve_failure_ladder_layer2_test.sh "$EZGHA_SERVE_LAYER2_ARTIFACT_DIR"
      - name: Upload Layer-2 serve-loop diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ezgha-serve-layer2-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ezgha-serve-layer2
          if-no-files-found: error
      - name: Post-job workspace cleanup fixture tests
        run: python3 -m unittest tests/runner_post_job_workspace_prune_test.py
      - name: Runner dashboard contract tests
        run: |
          python3 -m unittest tests/runner_dashboard_snapshot_test.py
          python3 -m unittest tests/ci_latency_probe_test.py
          python3 -m unittest tests/fleet_live_dashboard_test.py
          python3 -m unittest tests/queue_probe_test.py
          node --test tests/runner_dashboard_ui_test.mjs
          bash tests/runner_dashboard_host_probe_test.sh
          bash tests/runner_dashboard_publisher_test.sh
          bash tests/runner_dashboard_launchd_install_test.sh
          bash tests/install_watchdog_gate_test.sh
          bash tests/install_uninstall_aux_units_test.sh
          bash tests/systemd_units_install_guard_test.sh
          bash tests/refresh_runner_caches_test.sh
      - name: Mac trim guard shell regressions
        run: |
          bash tests/colima_trim_guard_test.sh
          bash tests/runner_offline_queued_alert_test.sh
          bash tests/scratch_migration_installer_test.sh
          bash tests/ezgha_host_health_alert_classification_test.sh
          bash tests/ezgha_host_health_parked_optout_test.sh
          bash tests/install_colima_trim_agent_test.sh
          bash tests/install_cache_warm_agent_test.sh
          bash tests/cleanup_ios_release_scratch_test.sh
          bash tests/testflight_workflow_alert_test.sh
          bash tests/testflight_workflow_alert_install_test.sh
          bash tests/gh_actions_cost_alert_test.sh
          bash tests/setup_native_macos_runner_test.sh
      - name: Cleanup-stuck-runs regression tests
        run: |
          bash tests/cleanup_stuck_runs_force_cancel_test.sh
          bash tests/cleanup_stuck_runs_multirepo_test.sh
          bash tests/cleanup_stuck_runs_race_skip_test.sh
          bash tests/cleanup_stuck_runs_verify_inconclusive_test.sh
          bash tests/cleanup_stuck_runs_unschedulable_test.sh
      - name: Queued-status fleet-truth regressions
        run: |
          bash tests/queued_status_fleet_truth_test.sh
          bash tests/ghost_reap_readonly_test.sh
      - name: Exit criteria CPU burst regressions
        run: |
          bash docs/test-verify-exit-criteria-gate4.sh
          bash tests/verify_exit_gate2_docker_mode_test.sh
          bash tests/verify_exit_gate3_cpu_burst_test.sh
          bash tests/verify_exit_gate3_burst_preflight_test.sh
          bash tests/verify_exit_toml_parser_integration_test.sh
      - name: Doctor-runner regression tests
        run: |
          bash tests/doctor_runner_expected_containers_test.sh
          bash tests/doctor_runner_heartbeat_parked_exempt_test.sh
          bash tests/doctor_runner_suspension_record_test.sh
          bash tests/doctor_runner_heartbeat_starvation_test.sh
          bash tests/doctor_runner_host_pressure_test.sh
          bash tests/doctor_runner_host_lifecycle_test.sh
          bash tests/doctor_runner_idle_resample_test.sh
          bash tests/doctor_runner_live_slot_gate_test.sh
          bash tests/doctor_runner_respawn_fetch_failure_test.sh
          bash tests/doctor_runner_respawn_journal_test.sh
          bash tests/doctor_runner_remote_config_and_queue_test.sh
          bash tests/doctor_runner_remote_optout_test.sh
          bash tests/doctor_runner_service_docker_endpoint_test.sh
          bash tests/doctor_runner_remote_user_bus_test.sh
          bash tests/doctor_runner_unreachable_remote_test.sh
          bash tests/doctor_runner_verdict_line_test.sh
          bash tests/doctor_sh_deprecation_stub_test.sh
      - name: Slot-drift reclaim correlation regression test (bead jleechan-tv58)
        # Hermetic test (no Docker daemon, no GitHub auth required). Runs
        # the production `release_stale_slots_from_with_containers` path
        # via `cargo test --bin ezgha` and asserts the recorded-id
        # reclaim branch surfaces `last_run_id` from a non-zero
        # `RunnerInfo.run_id`. Pre-patch the test name does not exist
        # (`RunnerInfo.run_id` was added in commit fcf373c on
        # jleechan-uurm-slot-reclaim-grace-window), so cargo matches
        # zero tests and the bash gate fails. Wired as a required job on
        # every PR. Timeout: 10 min (test runs in ~10s in CI).
        timeout-minutes: 10
        run: bash tests/slot_drift_reclaim_correlation_test.sh
      - name: Install ripgrep for integrate.sh PR-payload regression test
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Host-ops, GitHub App token, and PR-payload regression tests
        run: |
          bash tests/host_crash_containment_release1_artifacts_test.sh
          bash tests/assert_host_containment_release1_test.sh
          bash tests/apply_host_containment_release1_test.sh
          bash tests/install_host_containment_test.sh
          bash tests/host_ops_0725_test.sh
          bash tests/host_control_artifacts_test.sh
          bash tests/forbid_host_reboot_primitives_test.sh
          bash tests/assert_qemu_cpu_ceiling_test.sh
          bash tests/verify_exit_gate8_test.sh
          bash tests/integrate_pr_payload_regression_test.sh
          bash tests/launchd_docker_host_consumers_test.sh
          bash tests/refresh_gh_app_token_timeout_test.sh
          bash tests/verify_other_error_report.sh
          bash tests/verify_exit_gate0_test.sh
      - name: Install Python test-only dependencies
        run: pip install -r tests/requirements.txt
      - name: Mint-token and job-outcome-monitor Python regression tests
        run: |
          python3 -m unittest tests/verify_mint_no_retry_on_4xx.py
          python3 -m unittest tests/verify_mint_retry.py
          python3 -m unittest tests/job_outcome_monitor_test.py
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Format
        run: cargo fmt --check

  runner-cache-hydration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Build runner image
        run: DOCKER_BUILDKIT=0 docker build -f Dockerfile.runner -t ezgha-runner:ci-hydration .
      - name: Run runner cache hydration integration test
        run: EZGHA_TEST_IMAGE=ezgha-runner:ci-hydration bash tests/runner_cache_hydration_test.sh
      - name: Verify live cache RX byte budget end-to-end
        run: |
          set -euo pipefail
          tmp_root="$(mktemp -d)"
          trap 'rm -rf "$tmp_root"' EXIT
          mirror_dir="${tmp_root}/mirrors"
          gen_dir="${mirror_dir}/generations/jleechanorg__ez-gh-actions.1000"
          wh_dir="${tmp_root}/wheelhouse"
          cfg_file="${tmp_root}/config.toml"
          mkdir -p "${mirror_dir}/generations" "${mirror_dir}/active" "${wh_dir}"
          git clone --bare "${GITHUB_WORKSPACE}" "${gen_dir}"
          git -C "${gen_dir}" fetch --unshallow https://github.com/jleechanorg/ez-gh-actions.git +refs/heads/main:refs/heads/main 2>/dev/null \
            || git -C "${gen_dir}" fetch https://github.com/jleechanorg/ez-gh-actions.git +refs/heads/main:refs/heads/main
          git -C "${gen_dir}" rev-parse refs/heads/main > "${gen_dir}/SEED_SHA"
          rm -rf "${gen_dir}/objects/info/commit-graph"*
          ln -s "../generations/jleechanorg__ez-gh-actions.1000" "${mirror_dir}/active/jleechanorg__ez-gh-actions"
          docker run --rm --user "$(id -u):$(id -g)" -v "${wh_dir}:/out" ezgha-runner:ci-hydration bash -lc 'cp /opt/baked-wheels/*.whl /out/'
          python3 -c 'import sys; sys.path.insert(0, "scripts"); import ezgha_wheelhouse; ezgha_wheelhouse.prune_old_wheels(sys.argv[1])' "${wh_dir}"
          chmod -R a+rX "${mirror_dir}" "${wh_dir}"
          cat > "${cfg_file}" <<EOF
          version = 1
          [runner]
          image = "ezgha-runner:ci-hydration"
          wheelhouse_host_path = "${wh_dir}"
          git_mirror_host_path = "${mirror_dir}"
          EOF
          EZGHA_VERIFY_REPO=jleechanorg/ez-gh-actions \
            EZGHA_VERIFY_REQUIRE_TOKEN=0 \
            EZGHA_VERIFY_MIN_WHEELS=1 \
            EZGHA_VERIFY_PACKAGES="playwright==1.65.2" \
            bash scripts/verify_live_cache_savings.sh --config "${cfg_file}"
