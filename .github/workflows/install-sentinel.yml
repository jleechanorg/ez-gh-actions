# CI gate: install-time sentinel behavioral checks
#
# Triggered on every PR + push to main. Asserts that:
#   1. install.sh's watchdog sentinel is BEHAVIORAL (catches
#      '-f Dockerfile.runner' relative-path bug class), not just
#      presence-of-function-name
#   2. The watchdog's ensure_runner_image is exercisable end-to-end
#      via the integration test (Layer 2, real Docker)
#   3. No future PR reintroduces a presence-only sentinel for the
#      same class of bug
#
# Background: the 2026-08-20 Mac fleet outage (line 366 path bug)
# shipped because install.sh:619 only checked for the *presence* of
# 'ensure_runner_image' (string grep) — the function existed, the
# sentinel passed, the underlying build command was silently broken
# for 19 days (311+ REBUILD FAILED events, every 120s of watchdog tick).
#
# Companion to: install-gate-checks skill, CLAUDE.md "Sentinel checks
# at install time" section, bead jleechan-zgvz, commit b3fe954.

name: install-sentinel

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sentinel-behavioral:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert install.sh watchdog sentinel is BEHAVIORAL
        run: |
          set -euo pipefail
          SENTINEL_FILE="install.sh"
          WATCHDOG="scripts/ezgha-fleet-watchdog.sh"
          if [[ ! -f "$SENTINEL_FILE" || ! -f "$WATCHDOG" ]]; then
            echo "FATAL: install sentinel inputs not found" >&2
            exit 2
          fi

          # Behavioral check #1: execute the same validator functions used by
          # install.sh against the candidate watchdog script. This catches a
          # comment-only function name and both bare and './' relative paths.
          #
          # Differentiate regression vs bootstrap:
          #   - Sentinel present                  -> PASS (no action)
          #   - Sentinel missing, install.sh NOT in PR diff -> WARN (bootstrap case)
          #   - Sentinel missing, install.sh IS in PR diff    -> FAIL (regression)
          #
          # This prevents the chicken-and-egg problem where the CI
          # gate expects the sentinel to be in install.sh before the
          # install.sh change can be merged.
          INSTALL_SH_IN_DIFF=0
          for f in $(git diff --name-only origin/"$GITHUB_BASE_REF"...HEAD 2>/dev/null || git diff --name-only HEAD~1...HEAD); do
            if [[ "$f" == "$SENTINEL_FILE" ]]; then
              INSTALL_SH_IN_DIFF=1
              break
            fi
          done

          if grep -qE '^watchdog_has_image_heal_function\(\)' "$SENTINEL_FILE" &&
             grep -qE '^watchdog_has_relative_dockerfile\(\)' "$SENTINEL_FILE"; then
            VALIDATOR_FILE="$(mktemp)"
            trap 'rm -f "$VALIDATOR_FILE"' EXIT
            awk '/^watchdog_has_image_heal_function\(\)/,/^}/ { print }' "$SENTINEL_FILE" > "$VALIDATOR_FILE"
            awk '/^watchdog_has_relative_dockerfile\(\)/,/^}/ { print }' "$SENTINEL_FILE" >> "$VALIDATOR_FILE"
            # shellcheck disable=SC1090
            source "$VALIDATOR_FILE"
            if ! watchdog_has_image_heal_function "$WATCHDOG"; then
              echo "FAIL: watchdog is missing an actual ensure_runner_image function definition." >&2
              exit 1
            fi
            if watchdog_has_relative_dockerfile "$WATCHDOG"; then
              echo "FAIL: watchdog uses a relative Dockerfile.runner build path." >&2
              exit 1
            fi
            echo "OK: install.sh watchdog validator passed the candidate script."
          elif (( INSTALL_SH_IN_DIFF == 1 )); then
            echo "FAIL: $SENTINEL_FILE was modified in this PR but the watchdog validator is missing." >&2
            echo "      This is a REGRESSION of the 2026-08-20 outage class." >&2
            echo "      See install-gate-checks skill for the required pattern." >&2
            exit 1
          else
            echo "WARN: install.sh does NOT include the watchdog validator." >&2
            echo "      (bootstrap: install.sh was NOT modified in this PR; the validator lives in a separate change)" >&2
            echo "      This is expected when adding the CI gate alone. Merge of the install.sh" >&2
            echo "      validator change should happen via a separate PR (see commit b3fe954)." >&2
            echo "      See install-gate-checks skill for the required pattern." >&2
          fi

      - name: Assert watchdog build command uses absolute -f
        run: |
          set -euo pipefail
          WATCHDOG="scripts/ezgha-fleet-watchdog.sh"
          if [[ ! -f "$WATCHDOG" ]]; then
            echo "FATAL: $WATCHDOG not found" >&2
            exit 2
          fi

          # Behavioral check #2: ensure_runner_image MUST use
          # 'docker build -f "$repo_root/Dockerfile.runner"' (absolute
          # path), NOT 'docker build -f Dockerfile.runner' (relative).
          #
          # Differentiate regression vs bootstrap (same pattern as
          # step 1): only FAIL when the watchdog was modified in this
          # PR (regression). WARN otherwise (bootstrap — the fix
          # lives in commit b3fe954 on a separate branch).
          WATCHDOG_IN_DIFF=0
          for f in $(git diff --name-only origin/"$GITHUB_BASE_REF"...HEAD 2>/dev/null || git diff --name-only HEAD~1...HEAD); do
            if [[ "$f" == "$WATCHDOG" ]]; then
              WATCHDOG_IN_DIFF=1
              break
            fi
          done

          if grep -E "docker build -f Dockerfile\\.runner[^/]|docker build -f Dockerfile\\.runner[[:space:]]+-[a-z]|docker build -f Dockerfile\\.runner[[:space:]]+\\$" "$WATCHDOG"; then
            if (( WATCHDOG_IN_DIFF == 1 )); then
              echo "FAIL: $WATCHDOG was modified in this PR and reintroduced the relative '-f Dockerfile.runner' pattern (the 2026-08-20 bug class)." >&2
              exit 1
            else
              echo "WARN: $WATCHDOG contains relative '-f Dockerfile.runner' (the 2026-08-20 bug class)." >&2
              echo "      (bootstrap: \$WATCHDOG was NOT modified in this PR; the fix lives in commit b3fe954)" >&2
              echo "      See install-gate-checks skill for the required pattern." >&2
            fi
          fi

          # The absolute-path pattern is the goal state.
          if ! grep -qE "docker build -f .\"?(\\\$|\\\$\\{)(dockerfile_path|repo_root)" "$WATCHDOG"; then
            if (( WATCHDOG_IN_DIFF == 1 )); then
              echo "FAIL: $WATCHDOG was modified in this PR but does NOT use absolute '-f \$repo_root/Dockerfile.runner' or '-f \$dockerfile_path'." >&2
              echo "      See commit b3fe954 for the canonical fix." >&2
              exit 1
            else
              echo "WARN: $WATCHDOG does NOT use absolute '-f \$repo_root/Dockerfile.runner' (the 2026-08-20 fix not yet on main)." >&2
              echo "      (bootstrap: \$WATCHDOG was NOT modified in this PR; the fix lives in commit b3fe954)" >&2
            fi
          else
            echo "OK: watchdog build command uses absolute path."
          fi

      - name: Run integration test (Layer 2, real Docker)
        run: |
          set -euo pipefail
          # Requires docker-in-docker or a docker socket mount; on
          # the default ubuntu-latest runner this will exercise the
          # build path against the host's docker (if available) or
          # skip cleanly with a warning if not.
          if ! command -v docker >/dev/null 2>&1; then
            echo "SKIP: docker not on runner PATH; install-gate-checks behavioral assertion covered the broken path."
            exit 0
          fi
          if ! docker version >/dev/null 2>&1; then
            echo "SKIP: docker daemon not reachable; behavioral sentinel already validated the broken path."
            exit 0
          fi
          bash tests/watchdog_ensure_runner_image_test.sh

      - name: Assert skill exists
        run: |
          set -euo pipefail
          SKILL=".claude/skills/install-gate-checks/SKILL.md"
          if [[ ! -f "$SKILL" ]]; then
            echo "FAIL: $SKILL not found." >&2
            echo "      The install-gate-checks skill is required to document the behavioral sentinel pattern." >&2
            exit 1
          fi
          # The skill MUST include the 2026-08-20 reference (to
          # document the failure class) and the 'decision table'
          # section.
          if ! grep -q "2026-08-20" "$SKILL"; then
            echo "FAIL: $SKILL missing 2026-08-20 failure reference." >&2
            exit 1
          fi
          if ! grep -q "Decision table\|decision table" "$SKILL"; then
            echo "FAIL: $SKILL missing decision table." >&2
            exit 1
          fi
          echo "OK: install-gate-checks skill present with required sections."
