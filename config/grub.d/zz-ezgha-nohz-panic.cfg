# Appended by update-grub from /etc/default/grub.d/.
# Stop the 6.17 CFS/nohz idle-balance NX Oops (swapper / _nohz_idle_balance).
# panic=10: reboot 10s after panic so the box does not sit dead for hours.
# Do not add crashkernel= here — kdump-tools.cfg already injects crashkernel=512M,high.
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT nohz=off panic=10"
