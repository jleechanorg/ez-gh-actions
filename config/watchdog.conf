# /etc/watchdog.conf configuration for ez-gh-actions daemon hosts
# 
# Safety margin rationale:
# This host has 32 threads. Under a cold-start mass respawn of 16 runners,
# the 1-minute load average can briefly spike up to ~71.
# Under the old watchdog limit of max-load-1=24, the host would reboot itself,
# causing a self-inflicted outage loop.
#
# Best practice for watchdog(8) load thresholds is per-core limits:
# - Loose limit: ~10x/core 1-min load average. On 32 threads, 10 * 32 = 320.
# - Tight limit: ~5-7x/core 15-min load average.
#
# We configure a conservative but safe set of thresholds:
# - max-load-1 = 96  (Safe margin above the ~71 peak observed during mass respawn)
# - max-load-5 = 72
# - max-load-15 = 48
#
# Soft repair option:
# - repair-binary = /home/jleechan/.local/bin/watchdog-load-repair.sh
# - repair-timeout = 60
# - repair-maximum = 0
#
# The repair script is a shedder, not a reboot voter. watchdog(8) reboots
# the host if repair-binary exits non-zero, and ALSO if repair-binary exits
# 0 but load is still over threshold after `repair-maximum` successful
# attempts (live default was 1; that still rebooted Jeff-Ubuntu on
# 2026-08-25 after a "successful" shed that had not yet dropped loadavg).
# repair-maximum = 0 restores the documented previous-daemon behaviour: a
# repair program reporting success can always block reboot (watchdog.conf(5)).
#
# Blast radius: 32-thread box, observed cold-respawn 1-min peak ~71, threshold
# 96 (25 load units of margin before repair is invoked). After this change,
# crossing 96 only runs the shed ladder; the host stays up if shed fails.
# Remaining guards: PSI watcher, lima-vm MemoryMax=38G, guest actions.slice.
# Accepted gap: a fully wedged host will no longer get a load-average reboot
# failsafe from this daemon.

max-load-1 = 96
max-load-5 = 72
max-load-15 = 48

# watchdog-device = /dev/watchdog
# interval = 1
# realtime = yes
# priority = 1

repair-binary = /home/jleechan/.local/bin/watchdog-load-repair.sh
repair-timeout = 60
repair-maximum = 0
