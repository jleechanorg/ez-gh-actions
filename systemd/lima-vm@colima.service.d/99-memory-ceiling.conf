# Direct QEMU containment. Lima uses an escaped transient application slice on
# this host, so the service cgroup is the stable enforcement point.
#
# CPUQuota=1600% (16 CPUs) is the host-CPU fence on this 32-thread box.
# Live /etc/watchdog.conf max-load-1 is 96 (not the historical 24). Loadavg
# can still climb from D-state I/O; this quota only caps runnable QEMU time
# so 24 vCPUs cannot fully occupy the host. Keep 10 Linux runners.
# VM-backed values; host-docker uses systemd/host-docker/ (9G/10G).
# These policy ceilings require admission and workload control; they are not
# a current live-health measurement.
[Service]
MemoryHigh=34G
MemoryMax=38G
MemorySwapMax=2G
TasksMax=4096
MemoryAccounting=yes
CPUAccounting=yes
CPUQuota=1600%
