# Direct QEMU containment for host-docker.
# The Colima VM uses an 8 GiB guest while runners use host Docker under
# actions.slice. The host-docker contract is actions 28G + agents 12G +
# automation 5G + QEMU 10G; these caps are policy, not live-health proof.
# Apply the 10G ceiling only after the guest check passes.
[Service]
MemoryHigh=9G
MemoryMax=10G
MemorySwapMax=2G
TasksMax=4096
MemoryAccounting=yes
CPUAccounting=yes
CPUQuota=1600%
