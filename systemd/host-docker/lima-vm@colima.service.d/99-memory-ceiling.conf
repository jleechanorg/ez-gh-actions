# Direct QEMU containment for host-docker.
# The Colima VM uses an 8 GiB guest while runners use host Docker under
# actions.slice. Apply the 10G ceiling only after the guest check passes.
[Service]
MemoryHigh=9G
MemoryMax=10G
MemorySwapMax=2G
TasksMax=4096
MemoryAccounting=yes
CPUAccounting=yes
CPUQuota=1600%
