# Direct QEMU containment, host-docker variant (bead ez-gh-actions-154k).
# The Colima VM only runs openclaw-qdrant in a 8 GiB guest here; runners use
# host Docker under actions.slice. Lowering to 5G is only safe once the guest
# runs at <= 8 GiB: install.sh and apply-host-containment-release1.sh refuse
# while the colima instance reports more.
[Service]
MemoryHigh=9G
MemoryMax=10G
MemorySwapMax=2G
TasksMax=4096
MemoryAccounting=yes
CPUAccounting=yes
CPUQuota=1600%
